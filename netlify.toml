[build]
  # Clear Astro's content-layer cache first: Netlify restores it between
  # builds and it can serve stale content-collection JSON.
  command = "rm -rf .astro node_modules/.astro && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify serves at root — no base path needed
  # (GitHub Pages project sites need BASE_PATH, Netlify does not)
  BASE_PATH = ""
